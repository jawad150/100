  music_brief: "Original score from epic_music desi_epic as a local variant 'c08_epic': D, Phrygian-dominant colour, 100 BPM, 14 bars. Bar 0 cold (harmonium drone only), strings 8ths from 2.4 (LP 900), thin at the re-hook bar 5, opening LP 1200 -> 1500 through the corridor bars 7-10 with a taiko pulse on beats 1 and 3 of bars 8-10, shepard (2.2 s) and reverse cymbal (1.2 s) into 26.4; drop-out gate 25.8-26.4; DROP on bar 11 (26.4) with dhol_hit + dhol chaal + 808 (the one desi voice: dhol); resolve bar 12 (dhol -8); loop bar 13 cold, reverse cymbal ending on 33.6 into frame 0. No sitar, no dholak, no braam at the drop, no tape-stop. Rendered at 36 s and cropped to 33.6 so no fade lies inside the reel."
