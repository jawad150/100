# Production Packet (cinematic-director format) for C08 · Ek Frame ki Keemat. Twin of BRIEF.md (same folder): the brief
# wins on any conflict. No generative model renders this reel: every shot is built locally with the Reels Studio toolkit
# (jawad_kit / jawad_tx / jawad_grade / endcard / snake_captions), so `directed_prompt` is the film-layer description of the
# shot for the builders and the screening pass, not a model prompt. Times in seconds, frames at 30 fps (f = round(t * 30)).
# r2 (2026-10-08): viral gate r1 fixes 1-5 applied (f0 impact_soft; P8 push + rack and the new C3 centre / r0; the 28.2 hidden-JD
# glint and the pinned comment; the script-gated VO lines; card USKO YEH pending the lead). See BRIEF.md CHANGELOG.
project: "@jawad_mp4 (JD) personal-brand reels · slot 3 · C08 Ek Frame ki Keemat"
version: 2
deliverable:
  type: reel
  platform: [reels]
  aspect: "9:16"
  duration_s: 33.6
  frames: 1008
  count: 1
  fps: 30
  resolution_target: "1080x1920 (native; no upscale)"
  bpm: 100
  bars: 14
  look: ember
  extra_cuts:
    - "B: Trial Reel, hook B frames 0-89 spliced onto A frames 90-1007"
    - "VO + SFX only versions of A and B (in-app music test)"
emotional_core: "awe that turns into respect"
human_truth: "Jo cheez aasaan dikhti hai, us ke peeche kisi ka kaam hota hai: everyone has heard 'bas 5 minute ka kaam hai' about their work."
single_image: "Side-on, one paused frame pulled apart into a loaf of glowing glass slices in a black void; one slice holds JD's face, the slice beside it holds only his rim light, a hand's width of darkness between them; above it '12 / LAYERS'. (shot S2-02, frame 153, the cover)"
