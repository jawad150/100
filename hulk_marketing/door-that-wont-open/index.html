<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Door That Won't Open · Hulk Marketing</title>
<style>
  /* Inter Tight = the site's display face (PDF: Inter Tight ExtraBold captions); Fraunces Italic = the lime
     accent words of the reference reel; Hanken Grotesk = the site's UI/body face. */
  @font-face { font-family: Display; src: url(fonts/display.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Accent; src: url(fonts/accent.woff2) format('woff2'); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: UI; src: url(fonts/ui.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub</div>
<script type="module" src="film.js"></script>
</body>
</html>
