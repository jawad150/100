    - "typing dots (C02's motif)"
    - "ERROR, unsaved or delete dialogs and cursor hesitation (his Yaadein devices)"
    - "hearts, blob mascots, top/bottom original-vs-AI splits"
    - "real review apps, real brand logos, currency, prices with a currency, phone numbers, URLs, QR codes"
    - "religious decor in the glitter border; India-Pakistan cues"
    - "anything from Organic Fostering or Floret; the old prop library; built-in looks neon, amber, airy"
    - "K.flash, K.fade, post(flash=); full-frame white; the cream background outside the ad rect"
    - "first-person 'main' about Jawad's life; any claim about Jawad's real clients"
