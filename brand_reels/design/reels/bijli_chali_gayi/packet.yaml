# Production Packet: C11 Bijli Chali Gayi (@jawad_mp4), Jawad's cinematic-director schema
# (assets/production-packet-template.yaml; World Bible per references/world-bible.md).
# Companion of BRIEF.md in this folder: the brief holds the frame-exact tables (grid, text, VO, SFX, QA);
# this packet holds the direction layer. Nothing here is generated on Higgsfield or any image/video model:
# every shot is built locally (Blender props, 2.5D cut-outs, numpy/toolkit compositing). The only generation is
# the Vlad TTS voice. "directed_prompt" is therefore a build direction in film language for the builders.
# r2 (2026-10-08): viral gate FIX applied (GATE.md fixes 1-5, minor 6-9), mirrored from BRIEF.md r2 (see its CHANGELOG):
# trimmed V4/V7/V8, r2 VO windows, payoff spelling SIKHAYA, bold CRT edit + the same edit on the S5 monitor,
# rooftops readable at 360 px + the f220 far-window false start, V2 fallback placement, dedicated cover still.
project: "jawad_mp4 · reel 2 of 5 · C11 Bijli Chali Gayi"
version: 2
deliverable:
  type: reel
  platform: [reels]
  aspect: "9:16"
  duration_s: 34.667          # 1040 frames at 30 fps = 13 bars at 90 BPM
  count: 2                    # hook A (public) and hook B (Trial Reel), identical from frame 80
  fps: 30
  resolution_target: "1080p"
  extra_cuts: ["hook B trial version (f0-f79 differ)", "mix DRY: VO + SFX without the harmonium"]
emotional_core: "nostalgia that turns into quiet pride (sabr)"
human_truth: "Light jaati thi toh poora mohalla chhat pe hota tha; and every desi editor's finger still presses Ctrl+S by itself."
single_image: "Black room. A torch beam cuts through dust and finds the orange LED of a power-backup box blinking, while the word Bijli glows as the only thing still on battery (frame 60, the cover)."
world_bible:
  palette:
    - {name: "night", hex: "#070404"}
    - {name: "torch and tube-light ivory", hex: "#FFF3E6"}
    - {name: "LED flame", hex: "#FF6A1A"}
    - {name: "candle amber", hex: "#FFB547"}
    - {name: "drain red", hex: "#F2312B"}
    - {name: "dusk indigo shadow", hex: "#171431"}   # shadows only, never a light colour
  light_logic: "Every light is a battery (torch, candle, the backup box's LED) until the power returns; then every mains practical (tube light, bulbs, CRT, monitor) blooms locally at once. Mains light never fades: it snaps on, flickers darker, or dies."
  lens_set: ["28 mm for rooms and rooftops", "85 mm for JD and the tabletop", "100 mm macro for the candle, LED and keycaps"]
  camera_law: "Handheld torch-operator drift while the power is off; locked off the instant it is on."
  texture_line: "dusk finish, fine warm grain 0.020 at 1.7 px, halation on every practical, indigo-violet shadows, crushed but legal blacks."
  sound_motif: "the backup box's double beep: two 70 ms piezo pulses at D7, 4 frames apart"
  symbol: "the blinking orange LED"
  forbidden:
    - "more than 4 frames of empty near-black"
    - "white frames or full-frame flashes; flicker that brightens"
    - "utility, government, company, city or country names; load-shedding politics"
    - "UPS or inverter labels or logos on any prop; money on screen"
    - "a laptop, or any unsaved / ERROR / delete dialog"
    - "synthesised voices; crowd samples with intelligible words"
    - "cold blue moonlight"
    - "religious or national markers on rooftops (domes, minarets, temples, flags); cricket cues; team colours"
    - "mirrored JD; cross-dissolved faces; lip-sync"
    - "anything from Organic Fostering or Floret; the old prop library"
    - "first-person 'main' memories about Jawad"
