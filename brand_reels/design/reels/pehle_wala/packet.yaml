  palette:
    - {name: "near-black warm void", hex: "#070404"}
    - {name: "flame orange", hex: "#FF6A1A"}
    - {name: "red", hex: "#F2312B"}
    - {name: "ivory type", hex: "#FFF3E6"}
  light_logic: "Every light is motivated inside the frame: the ember backlight behind the chai glass lights the ad; the void is lit only by the inferno fire floor from below and red haze; glass UI catches flame rims from the ad's side; JD's reaction tile takes its rim from the ad (screen-right)."
