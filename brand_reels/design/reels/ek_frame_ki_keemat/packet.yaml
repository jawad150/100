    - {name: NIGHT_0, hex: "#070404"}
    - {name: FLAME, hex: "#FF6A1A"}
    - {name: AMBER, hex: "#FFB547"}
    - {name: IVORY, hex: "#FFF3E6"}
    - {name: ASH, hex: "#A8978C"}
    - {name: RED, hex: "#F2312B"}
  palette_line: "near-black NIGHT_0 #070404, flame FLAME #FF6A1A, hot cores AMBER #FFB547, labels IVORY #FFF3E6 and ASH #A8978C, accent RED #F2312B"
  light_logic: "the void is lit only by the frame's own layers; the frame lights the room it sits in"
  lens_set: ["35 mm corridor (f_px 1867)", "85 mm side-on stack and fly-through (f_px 4533)", "100 mm frontal re-hook (f_px 5333)"]
  camera_law: "the camera moves only while the frame is paused; when it plays, the camera locks"
  texture_line: "ember finish: crushed warm blacks, halation on highlights, fine grain 0.016 at 1.8 px, no full-frame flash"
  sound_motif: "the pause click (a mouse micro-switch, then glass on glass)"
  symbol: "the pause / timecode chip 00:00:00:01"
  forbidden:
    - "hours, minutes, rates, prices, clients, view counts or any invented fact about Jawad"
    - "a 13th layer, or any light, particle or text inside the frame that is not one of its 12 layers"
    - "particles in the void outside the frame's layers"
    - "real NLE names, logos or UI clones"
    - "a large centred play/pause ring (his OpenArt cover device)"
    - "ERROR / unsaved / delete dialogs; keycaps; Ctrl+Z (C11 and C26 devices)"
    - "white flashes, fades to black or to silence (K.flash, K.fade, post(flash=))"
    - "anything from Organic Fostering or Floret; hearts; the old prop library"
    - "mirroring, warping or lip-syncing the cut-out"
