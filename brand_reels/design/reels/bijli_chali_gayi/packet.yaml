  - tag: JD
    identity_source: locked
    identity_ref: "workspace/brand_reels/charsheet/cutouts/suit_profile.png | suit_smiling.png (2x masters, depth + metadata alongside)"
    block: "JD: Jawad (@jawad_mp4) from his suit character sheet: full dark beard and moustache, dark hair swept up and back, warm brown skin, black three-piece suit, white shirt, dark tie. Shown only as the face of 'an editor'; never narrated as 'main'."
    wardrobe_by_scene: {S7: "suit as on the sheet", S8: "suit as on the sheet"}
    gesture: "watches the candle in profile with lips pressed and steady breathing; at the power return, a closed-mouth smile"
