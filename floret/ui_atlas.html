<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Floret UI Atlas</title>
<!--
  Texture atlas for the Blender render (floret/blender_phone.py). One screenshot per frame, at 1.5x:
    main screen  (0, 0)          776 x 1688   iPhone 16 Pro display aspect
    quote cards  (820, i*240)    1100 x 230   one per instrument
    back screen  (1920, 0)       776 x 1688   chart on the phone behind
  render(t) draws time t. Card positions in 3D are animated in Blender, not here.
-->
<style>
  html, body { margin: 0; width: 2700px; height: 1700px; overflow: hidden; background: #000; }
  body { font-family: "Inter", "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .scr { position: absolute; top: 0; width: 776px; height: 1688px; overflow: hidden; background: #0b0b10; }
  #main { left: 0; }
  #back { left: 1920px; }

  /* iPhone 16 Pro status bar (402 pt wide display -> 1.93 px/pt) */
  .clock { position: absolute; left: 100px; top: 40px; color: #fff; font-weight: 600; font-size: 33px; }
  .island { position: absolute; left: 266px; top: 21px; width: 244px; height: 71px; border-radius: 36px; background: #000; }
  .sig { position: absolute; right: 160px; top: 46px; display: flex; gap: 4px; align-items: flex-end; }
  .sig i { display: block; width: 6px; background: #fff; border-radius: 2px; }
  .wifi { position: absolute; right: 120px; top: 45px; width: 28px; height: 22px; }
  .batt { position: absolute; right: 70px; top: 45px; width: 46px; height: 22px; border-radius: 7px; border: 2px solid rgba(255,255,255,.55); box-sizing: border-box; }
  .batt::after { content: ""; position: absolute; left: 3px; top: 3px; width: 30px; height: 12px; border-radius: 3px; background: #fff; }

  .acct { position: absolute; left: 40px; top: 112px; display: flex; gap: 10px; align-items: center; }
  .acct b { color: #fff; font-size: 24px; font-weight: 700; }
  .acct span { font-size: 15px; font-weight: 700; padding: 3px 9px; border-radius: 7px; }
  .acct .real { background: #1d6b3a; color: #8ff0b4; }
  .acct .mt5 { background: #26324d; color: #9fb7ff; }
  .tabs { position: absolute; left: 30px; top: 162px; width: 716px; height: 56px; border-radius: 28px; background: #1b1b24; display: flex; }
  .tabs div { flex: 1; color: #8a8a99; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; border-radius: 28px; }
  .tabs div.on { background: #30303d; color: #fff; }
  .search { position: absolute; left: 30px; top: 236px; width: 716px; height: 54px; border-radius: 27px; background: #15151d; color: #5d5d6d; font-size: 21px; line-height: 54px; padding-left: 64px; box-sizing: border-box; }
  .search::before { content: ""; position: absolute; left: 24px; top: 15px; width: 18px; height: 18px; border: 3px solid #5d5d6d; border-radius: 50%; }

  .cols { position: absolute; left: 40px; right: 40px; top: 330px; display: flex; justify-content: space-between; color: #5f5f70; font-size: 19px; font-weight: 600; }
  .chartwrap { position: absolute; left: 18px; top: 1440px; width: 740px; height: 214px; border-radius: 28px; background: #101017; overflow: hidden; }
  .tf { position: absolute; left: 16px; top: 12px; display: flex; gap: 6px; }
  .tf span { font-size: 18px; font-weight: 600; color: #7d7d8c; padding: 6px 13px; border-radius: 13px; }
  .tf span.on { background: #2a2a36; color: #fff; }
  #chart { position: absolute; left: 0; top: 44px; width: 740px; height: 170px; }
  .homebar { position: absolute; left: 268px; bottom: 16px; width: 240px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.65); }

  #backChart { position: absolute; left: 0; top: 0; width: 776px; height: 1688px; }
  .bhead { position: absolute; left: 44px; top: 120px; color: #fff; font-size: 30px; font-weight: 700; }
  .bhead small { display: block; color: #7d7d8e; font-size: 18px; font-weight: 500; margin-top: 4px; }

  /* ---------- quote cards (1070 x 190) ---------- */
  .card { position: absolute; left: 820px; width: 1100px; height: 230px; border-radius: 56px; box-sizing: border-box; overflow: hidden;
    background: linear-gradient(180deg, #25252d 0%, #15151b 100%);
    border: 4px solid rgba(205,205,220,.42);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.12); }
  .card .ico { position: absolute; left: 34px; top: 30px; width: 58px; height: 58px; border-radius: 50%; }
  .card .sym { position: absolute; left: 106px; top: 32px; color: #fff; font-size: 42px; font-weight: 700; letter-spacing: .3px; }
  .card .desc { position: absolute; top: 45px; color: #7a7a8c; font-size: 25px; font-weight: 500; white-space: nowrap; }
  .card .chg { position: absolute; left: 560px; top: 110px; font-size: 29px; font-weight: 600; }
  .card canvas.spark { position: absolute; left: 430px; top: 150px; width: 330px; height: 62px; }
  .box { position: absolute; overflow: hidden; }
  .box .lbl { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 23px; font-weight: 600; color: rgba(255,255,255,.75); }
  .box .px { position: absolute; left: 0; right: 0; top: 42px; text-align: center; font-size: 47px; font-weight: 700; color: #fff; letter-spacing: .3px; font-variant-numeric: tabular-nums; }
  .box .px small { font-size: 34px; }
  .box .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .sell { left: 34px; top: 104px; width: 360px; height: 108px; border-radius: 24px 24px 24px 54px; background: linear-gradient(180deg, #ff4855 0%, #d71d2e 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.35); }
  .buy  { left: 780px; top: 26px; width: 292px; height: 122px; border-radius: 24px 60px 60px 24px; background: linear-gradient(180deg, #3a78ff 0%, #1240e2 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.35); }

  .i-gold { background: radial-gradient(circle at 35% 30%, #fff3b0, #f2c230 45%, #a77a06 100%); }
  .i-silver { background: radial-gradient(circle at 35% 30%, #ffffff, #c9ccd6 45%, #6d717e 100%); }
  .i-oil { background: radial-gradient(circle at 35% 30%, #5a5a66, #1d1d24 60%, #000 100%); box-shadow: inset 0 0 0 2px #444; }
  .i-brent { background: radial-gradient(circle at 35% 30%, #6e5a3a, #2a2114 60%, #000 100%); box-shadow: inset 0 0 0 2px #4a3d28; }
  .i-gas { background: radial-gradient(circle at 35% 30%, #9fd8ff, #2f8be0 50%, #0b3f86 100%); }
  .i-copper { background: radial-gradient(circle at 35% 30%, #ffd2b0, #d47a3c 45%, #7a3410 100%); }
  .i-plat { background: radial-gradient(circle at 35% 30%, #ffffff, #b8c6d6 45%, #56677a 100%); }
</style>
</head>
<body>
<div class="scr" id="main">
  <div class="clock">9:41</div>
  <div class="island"></div>
  <div class="sig"><i style="height:8px"></i><i style="height:12px"></i><i style="height:16px"></i><i style="height:20px"></i></div>
  <svg class="wifi" viewBox="0 0 28 22"><path d="M14 20l4-4.6a6 6 0 0 0-8 0z M14 4C9 4 4.8 6 1.6 9.2l2.6 3A13.6 13.6 0 0 1 14 8c3.8 0 7.3 1.5 9.8 4.2l2.6-3C23.2 6 19 4 14 4z" fill="#fff"/></svg>
  <div class="batt"></div>
  <div class="acct"><b>MT5 Account</b><span class="real">Real</span><span class="mt5">MT5</span></div>
  <div class="tabs"><div class="on">Quotes</div><div>Trades</div><div>History</div></div>
  <div class="search">Favorites</div>
  <div class="cols"><span>Symbol</span><span>Bid / Ask</span></div>
  <div class="chartwrap">
    <div class="tf"><span>M1</span><span>M5</span><span class="on">M15</span><span>H1</span><span>H4</span><span>D1</span></div>
    <canvas id="chart" width="1480" height="340"></canvas>
  </div>
  <div class="homebar"></div>
</div>
<div class="scr" id="back">
  <canvas id="backChart" width="776" height="1688"></canvas>
  <div class="clock">9:41</div>
  <div class="island"></div>
  <div class="bhead">GOLD<small>Spot Gold vs US Dollar · H1</small></div>
</div>

<script>
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const fmt = (v, d) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- instruments
const INSTR = [
  { sym: 'GOLD',      desc: 'Spot Gold vs US Dollar',   ico: 'i-gold',   base: 4616.27, d: 2, vol: 0.55,  spread: 0.35,  open: 4607.10 },
  { sym: 'SILVER',    desc: 'Spot Silver vs US Dollar', ico: 'i-silver', base: 52.384,  d: 3, vol: 0.012, spread: 0.030, open: 51.902 },
  { sym: 'CRUDE OIL', desc: 'WTI Crude Oil',            ico: 'i-oil',    base: 61.42,   d: 2, vol: 0.025, spread: 0.03,  open: 61.78 },
  { sym: 'BRENT',     desc: 'Brent Crude Oil',          ico: 'i-brent',  base: 65.18,   d: 2, vol: 0.025, spread: 0.03,  open: 64.71 },
  { sym: 'NATGAS',    desc: 'Natural Gas',              ico: 'i-gas',    base: 3.412,   d: 3, vol: 0.004, spread: 0.006, open: 3.448 },
  { sym: 'COPPER',    desc: 'Copper vs US Dollar',      ico: 'i-copper', base: 5.0315,  d: 4, vol: 0.0016,spread: 0.0030,open: 4.9980 },
  { sym: 'PLATINUM',  desc: 'Spot Platinum',            ico: 'i-plat',   base: 1642.80, d: 2, vol: 0.45,  spread: 0.90,  open: 1631.40 },
];
INSTR.forEach((ins, k) => {
  const r = mulberry32(100 + k);
  ins.period = 0.55 + r() * 0.5;
  ins.phase = r() * ins.period;
  ins.ticks = [];
  let p = ins.base, drift = ins.base > ins.open ? 1 : -1;
  for (let n = 0; n < 400; n++) { p += (r() - .5 + drift * 0.04) * ins.vol * 2; ins.ticks.push(p); }
  ins.hist = [];
  let q = ins.open;
  for (let n = 0; n < 40; n++) { q += (ins.base - ins.open) / 40 + (r() - .5) * ins.vol * 3; ins.hist.push(q); }
  ins.hist[39] = ins.base;
});
const tickIndex = (ins, t) => Math.max(0, Math.floor((t - ins.phase) / ins.period));

const cards = INSTR.map((ins, i) => {
  const c = document.createElement('div'); c.className = 'card'; c.style.top = (i * 240) + 'px';
  c.innerHTML = `
    <div class="ico ${ins.ico}"></div>
    <div class="sym">${ins.sym}</div>
    <div class="desc">${ins.desc}</div>
    <div class="box sell"><div class="lbl">Sell</div><div class="px"></div><div class="flash"></div></div>
    <div class="chg"></div>
    <canvas class="spark" width="660" height="124"></canvas>
    <div class="box buy"><div class="lbl">Buy</div><div class="px"></div><div class="flash"></div></div>`;
  document.body.appendChild(c);
  const q = s => c.querySelector(s);
  return { ins, sym: q('.sym'), desc: q('.desc'), sellPx: q('.sell .px'), buyPx: q('.buy .px'),
           sellFl: q('.sell .flash'), buyFl: q('.buy .flash'), chg: q('.chg'), sparkG: q('.spark').getContext('2d') };
});

function pxHTML(v, d) {
  const s = fmt(v, d), cut = s.length - 2;
  return `<small>${s.slice(0, cut)}</small>${s.slice(cut)}`;
}

function drawSpark(c, t) {
  const g = c.sparkG, W = 660, H = 124, ins = c.ins;
  g.clearRect(0, 0, W, H);
  const n = tickIndex(ins, t);
  const pts = ins.hist.slice(Math.min(40, n + 1)).concat(ins.ticks.slice(Math.max(0, n - 39), n + 1)).slice(-40);
  let mn = Math.min(...pts), mx = Math.max(...pts); if (mx - mn < 1e-9) mx = mn + 1;
  const up = pts[pts.length - 1] >= ins.open, col = up ? '#2fd07f' : '#ff4a57';
  const X = i => 4 + i * (W - 8) / (pts.length - 1), Y = v => H - 8 - (v - mn) / (mx - mn) * (H - 20);
  g.beginPath(); pts.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.strokeStyle = col; g.lineWidth = 4; g.lineJoin = 'round'; g.stroke();
}

// ---------------------------------------------------------------- candle charts (red / green)
function makeCandles(seed, n, start, vol, bias) {
  const r = mulberry32(seed), out = [];
  let p = start, trend = bias;
  for (let i = 0; i < n; i++) {
    if (i % 9 === 0) trend = bias + (r() - .5) * vol * 0.9;
    const path = [p];
    for (let k = 1; k <= 24; k++) path.push(path[k - 1] + trend / 24 + (r() - .5) * vol * 0.55);
    const close = path[24];
    out.push({ open: p, close, path, high: Math.max(...path) + r() * vol * .25, low: Math.min(...path) - r() * vol * .25 });
    p = close + (r() - .5) * vol * .1;
  }
  return out;
}
const MAIN = makeCandles(11, 140, 4560, 3.2, 0.55);
const BACK = makeCandles(23, 160, 4480, 3.0, 0.45);
const CANDLE_SEC = 1.35;

function candleAt(arr, j, frac) {
  const c = arr[j];
  if (frac >= 1) return c;
  const p = c.path.slice(0, Math.max(1, Math.round(frac * 24)) + 1);
  return { open: c.open, close: p[p.length - 1], high: Math.max(...p), low: Math.min(...p) };
}

function drawCandles(g, W, H, arr, cf, visible, opts) {
  g.clearRect(0, 0, W, H);
  const padR = opts.axis ? 150 : 30, padT = opts.padT || 30, padB = opts.padB || 40;
  const cw = (W - padR - 20) / visible;
  const jNow = Math.floor(cf), frac = cf - jNow;
  let mn = 0, mx = 0, S = 8;
  for (let s = 0; s < S; s++) {
    const c2 = cf - s * 0.18, j0 = Math.max(0, Math.floor(c2) - visible), j1 = Math.floor(c2);
    let a = Infinity, b = -Infinity;
    for (let j = j0; j <= j1; j++) { a = Math.min(a, arr[j].low); b = Math.max(b, arr[j].high); }
    mn += a / S; mx += b / S;
  }
  const pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
  const Y = v => padT + (1 - (v - mn) / (mx - mn)) * (H - padT - padB);
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 2; g.setLineDash([6, 8]);
  for (let k = 1; k < 5; k++) { const y = padT + k * (H - padT - padB) / 5; g.beginPath(); g.moveTo(0, y); g.lineTo(W - padR + 10, y); g.stroke(); }
  for (let k = 1; k < 6; k++) { const x = k * (W - padR) / 6; g.beginPath(); g.moveTo(x, padT); g.lineTo(x, H - padB); g.stroke(); }
  g.setLineDash([]);
  if (opts.axis) {
    g.fillStyle = 'rgba(200,200,215,.55)'; g.font = '600 24px Inter'; g.textAlign = 'left';
    for (let k = 0; k <= 5; k++) { const y = padT + k * (H - padT - padB) / 5; g.fillText(fmt(mn + (1 - k / 5) * (mx - mn), 2), W - padR + 18, y + 8); }
  }
  const right = W - padR - cw * 1.2;
  let last = null;
  for (let j = Math.max(0, jNow - visible - 1); j <= jNow; j++) {
    const c = j === jNow ? candleAt(arr, j, frac) : arr[j];
    const x = right - (cf - j) * cw;
    if (x < -cw) continue;
    const up = c.close >= c.open;
    g.strokeStyle = up ? '#22c983' : '#f23d4f'; g.lineWidth = Math.max(2, cw * 0.12);
    g.beginPath(); g.moveTo(x, Y(c.high)); g.lineTo(x, Y(c.low)); g.stroke();
    const y0 = Y(Math.max(c.open, c.close)), y1 = Y(Math.min(c.open, c.close)), bw = cw * 0.66;
    const grd = g.createLinearGradient(0, y0, 0, Math.max(y1, y0 + 2));
    grd.addColorStop(0, up ? '#3ee39d' : '#ff5a69'); grd.addColorStop(1, up ? '#14a568' : '#d0202f');
    g.fillStyle = grd;
    g.fillRect(x - bw / 2, y0, bw, Math.max(3, y1 - y0));
    last = c;
  }
  if (last && opts.axis) {
    const up = last.close >= last.open, y = Y(last.close), col = up ? '#22c983' : '#f23d4f';
    g.strokeStyle = col; g.lineWidth = 2; g.setLineDash([10, 8]);
    g.beginPath(); g.moveTo(0, y); g.lineTo(W - padR + 6, y); g.stroke(); g.setLineDash([]);
    g.fillStyle = col; g.beginPath(); g.roundRect(W - padR + 4, y - 22, padR - 8, 44, 10); g.fill();
    g.fillStyle = '#fff'; g.font = '700 24px Inter'; g.fillText(fmt(last.close, 2), W - padR + 16, y + 9);
  }
}
const chartG = $('chart').getContext('2d'), backG = $('backChart').getContext('2d');

function render(t) {
  cards.forEach(c => {
    const ins = c.ins, n = tickIndex(ins, t), p = ins.ticks[n];
    const prev = ins.ticks[Math.max(0, n - 1)], since = t - (ins.phase + n * ins.period);
    c.sellPx.innerHTML = pxHTML(p, ins.d);
    c.buyPx.innerHTML = pxHTML(p + ins.spread, ins.d);
    const fl = n > 0 ? Math.pow(clamp(1 - since / 0.35), 2) * 0.16 : 0;
    c.sellFl.style.opacity = p < prev ? fl : fl * 0.4;
    c.buyFl.style.opacity = p > prev ? fl : fl * 0.4;
    const ch = (p - ins.open) / ins.open * 100;
    c.chg.textContent = (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%';
    c.chg.style.color = ch >= 0 ? '#2fd07f' : '#ff4a57';
    drawSpark(c, t);
  });
  drawCandles(chartG, 1480, 340, MAIN, 70 + t / CANDLE_SEC, 30, { axis: true, padT: 24, padB: 24 });
  drawCandles(backG, 776, 1688, BACK, 90 + t / (CANDLE_SEC * 1.2), 18, { axis: false, padT: 260, padB: 160 });
}
window.render = render;
window.ready = document.fonts.ready.then(() => {
  cards.forEach(c => { c.desc.style.left = (106 + c.sym.offsetWidth + 16) + 'px'; });
  render(0); return true;
});
</script>
</body>
</html>
