# Production Packet (cinematic-director format) for reel 4 / C02 "Beta, tum karte kya ho?"
# Twin of BRIEF.md in this folder; BRIEF.md wins on any wording difference. No image or video is generated in this
# project: every "directed_prompt" below is art direction for the toolkit builders (2.5D cut-outs, ui, type3d).
# r2 (2026-10-09): viral gate r1 fixes 1-5 + notes 6-8 (GATE.md §8) and script v2 (SCRIPT.md); see BRIEF.md CHANGELOG.
project: "@jawad_mp4 five-reel set · reel 4 · C02 Beta, tum karte kya ho? (module beta_tum_karte_kya_ho)"
version: 2
deliverable:
  type: reel
  platform: [reels]
  aspect: "9:16"
  duration_s: 36.4
  count: 1
  fps: 30
  resolution_target: "1080p"
  frames: 1092
  bpm: 85.714            # code: 600 / 7 -> 21 frames per beat, 84 per bar, 13 bars
  look: gold_hour
  extra_cuts:
    - "version B (Trial Reel): hook B frames 0-73 + A frames 74-83 without captions, identical to A from frame 84"
emotional_core: "amusement, then tenderness"
human_truth: "Every desi parent asks what you do, and translates the answer into something they already know."
single_image: "Frame 900 (30.0 s): Mummy's glass chat bubble glowing in the upper half, MERA BETA / cinema / BANATA HAI, above JD's suit bust, hand flat on his chest, eyes up-right, a low gold sun hidden behind his head rimming him in flame."
world_bible:
  palette:
    - {name: night, hex: "#070404"}
    - {name: flame, hex: "#FF6A1A"}
    - {name: gold, hex: "#FF9F1C"}
    - {name: red (accent), hex: "#F2312B"}
    - {name: amber (accent), hex: "#FFB547"}
    - {name: ivory (type), hex: "#FFF3E6"}
  light_logic: "Two sources only: the low sun through the window behind JD (gold backlight, flame rim strongest camera-right) and the phone screen below frame (soft amber from below on JD's face); glass UI glows only from its own rim. No top light, no spotlight, no god rays."
  lens_set: ["50 mm phone-held for the room and the UI", "85 mm for JD's busts, shallow (aperture 24)", "100 mm macro for the typing-dot push into the payoff"]
  camera_law: "Phone-held intimacy: UI floats with a 4 px handheld drift; JD only gets slow push-ins (1.2 %/s) and hard-cut punch-ins on reactions; never a dissolve between faces, never an orbit, never a whip on JD."
  texture_line: "gold_hour finish, brown-black floor, soft contrast, film grain 0.018 at 1.6 px, halation on the sun and type glow only, no god rays."
  sound_motif: "the message pop (notif_ping tuned to A6) and the typing-dot tick"
  symbol: "the three typing dots"
  forbidden:
    - "Mummy on screen (face, hands or voice)"
    - "hearts; shehnai; mehndi or any religious motif or greeting"
    - "ERROR dialogs"
    - "WhatsApp look: green, double ticks, doodle wallpaper, Seen"
    - "real app UIs, brand logos, currency, phone numbers, city or country names, flags, cricket cues"
    - "a centred ring with radial rays; god rays (rays=0.0)"
    - "first-person 'main' about Jawad's life; any fact about his family"
    - "JELLY or bounce on brand type; cross-dissolves between faces; mirrored cut-outs"
    - "old prop library (chat_bubble, pin_phone, heart, house, star_badge ...); Organic Fostering / Floret anything"
    - "full-frame flashes or fades (exposure pushes only)"
cast:
  - tag: JD
    identity_source: locked
    identity_ref: "workspace/brand_reels/charsheet/cutouts/{suit_confused,suit_shocked,suit_neutral,suit_hand_on_chest}.png (+ _depth.png, .json)"
    block: "JD: the suit character sheet only: black three-piece suit, white shirt, black tie, fuller side-swept dark hair, full beard; frontal busts, eye midpoint pinned at screen (540, 1280), display scale 0.92-0.987 of the 2x master."
    wardrobe_by_scene: {S1: suit, S3: suit, S4: suit, S7: suit, S8: suit, SB: suit}
    gesture: "confused: knitted brows, mouth open mid-word · shocked: wide eyes, raised brows, mouth shut · neutral: level stare to lens · hand-on-chest: hand flat on chest, eyes up-right"
locations:
  - tag: HOME_GOLDEN
    block: "A brown-black desi room at golden hour seen through a phone: low gold window glow behind JD, warm dust in the air, nothing that names a religion, country or brand."
    anchors: ["window glow low-centre behind JD (gold_hour horizon band y ~1500, sun core behind his chest)", "warm bokeh discs in the upper half, kept off type", "dark wooden table surface (time-skip shot only)"]
    light_plot: "Key = the sun behind JD (backlight + flame rim camera-right, red counter-rim camera-left); fill = phone glow from below-front (amber, 0.08 linear); UI self-lit; window light dims 15 % from 15.4 s and the sun sinks in the end-card world."
