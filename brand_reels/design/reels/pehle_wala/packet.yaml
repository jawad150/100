# Production Packet: C26 "Pehle Wala Hi Theek Tha (v1 se v27 tak)" (cinematic-director format)
# Twin of BRIEF.md in this folder; BRIEF.md wins on any numeric detail. All world_bible strings are verbatim and
# repeated inside every directed_prompt. Nothing in this reel is AI-generated except the voice: every "prompt" below
# is a build description for the local toolkit (jawad_kit / jawad_tx / ui / type3d / Blender), not a generation prompt.
project: "@jawad_mp4 brand reels, reel 1 of 5: C26 Pehle Wala Hi Theek Tha (module pehle_wala)"
version: 1
deliverable:
  type: reel
  platform: [reels]
  aspect: "9:16"
  duration_s: 34.1333          # 16 bars at 112.5 BPM = 1024 frames
  count: 1
  fps: 30
  resolution_target: "1080p"   # 1080x1920
  extra_cuts: ["hook B Trial Reel: frames 0-79 from pehle_wala_hookb, frames 80-1023 identical to the main master",
               "audio Version B (VO + SFX only) for both hooks"]
emotional_core: "mischief: exasperated recognition turning into laughter"
human_truth: "Every client's 'bas ek chhota sa change' is never one change, and after all of them the first version was the one they wanted."
single_image: "A pristine chai ad inside a dark-glass review player, the status chip reading 'Approved', the version counter back at v1, the flame keyword 'pehle wala' over 'HI THEEK THA', and JD smirking in a small reaction-cam tile docked to the player's lower-left corner, steam still curling off the glass."
