# Production Packet (cinematic-director format) for Reel 5 · C15 · Log Kya Kahenge.
# Companion of BRIEF.md (same folder); BRIEF.md wins on any build detail. Version 2 = BRIEF r2 (viral gate r1 fixes; see the
# BRIEF CHANGELOG). Nothing in this project is generated by an
# image/video model: every shot is built locally (numpy crowd sprites, 2.5D cut-outs, jawad_kit type, jawad_tx transitions).
# 'directed_prompt' therefore holds the build description in the film-layer order of world-bible.md section 5, for the
# builders and the screening pass; production-consistency's model routing does not apply (TTS only: Higgsfield Vlad).
project: "@jawad_mp4 (JD) personal-brand reels, slot 5: C15 Log Kya Kahenge (log_kya_kahenge)"
version: 2
deliverable:
  type: reel
  platform: [reels]
  aspect: "9:16"
  duration_s: 35.2
  count: 1
  fps: 30
  resolution_target: "1080p"
  frames: 1056
  bpm: 75
  bars: 11
  look: noir_ember
  extra_cuts:
    - "hook B Trial Reel: frames 0-89 replaced by the 135 mm hook (spliced at frame 90)"
    - "mix B: VO + SFX only (for an in-app track)"
emotional_core: "fear, then liberation"
human_truth: "Jin logon ke darr se hum ruke hain, woh khud apne 'log kya kahenge' mein ruke hue hain. Everyone is someone else's 'log'."
single_image: "At the end of the orbit (19.2-20.0 s, 135 mm): the tiers have turned edge-on into razor-thin lines of floodlight, and behind each line a row of real people sits heads-down, faces lit only by their own phones."
world_bible:
  palette:
    - {name: "warm black (NIGHT_0)", hex: "#070404"}
    - {name: "smoke grey cardboard (SMOKE)", hex: "#2A1A15"}
    - {name: "ash floodlit edges (ASH)", hex: "#A8978C"}
    - {name: "amber eyes and phones (AMBER)", hex: "#FFB547"}
    - {name: "flame, only after the turn at 25.6 s (FLAME)", hex: "#FF6A1A"}
  light_logic: "One hard top floodlight (interrogation) from the lamp bank top-right until 25.6 s; after it, one low warm light from screen-left at the field's edge. Phones are the only other light, and they appear only after the reveal."
  lens_set: ["24 mm amphitheatre (focal 1280 px)", "135 mm compressed rows (focal 7200 px)", "85 mm JD (focal 4533 px)"]
  camera_law: "Locked off while the crowd judges; one rise (9.6-12.8 s) and one 70-degree orbit (16.0-19.2 s, the reveal); never handheld; the 20.0 s focus pull is a lens move."
  texture_line: "noir_ember finish: near-monochrome warm black, fine grain 0.022 at 1.7 px, halation on the floodlight and the phones, mono except flame and amber."
  sound_motif: "the whisper wall: wordless, pitched-down, reversed CC0 crowd samples"
  symbol: "the edge-on card (a thin line of light)"
  forbidden:
    - "any count of people"
    - "first-person claims about Jawad's life (main / mera / meri)"
    - "real faces or features in the crowd"
    - "cricket cues: pitch, wickets, stumps, scoreboards, jerseys, team colours, flags, trophies"
    - "religious, regional or national markers on any silhouette (no headwear, scarves, flags)"
    - "slurs, booing or obscene gestures; words inside the whisper wall"
    - "more than one floodlight clunk; a clunk cold open; a spotlight cone on a lone figure"
    - "full-frame flashes or fades (exposure pushes only); ERROR or delete dialogs; blob mascots; a centred play ring with rays"
    - "JD mirrored, warped, lip-synced or held more than 3.5 s on one pose"
    - "anything from Organic Fostering or Floret; the old prop library; built-in looks neon / amber / airy"
cast:
  - tag: JD
    identity_source: locked
    identity_ref: "workspace/brand_reels/charsheet/cutouts/street_threequarter_turn.png; street_chinup_gaze.png (+ _depth.png, .json)"
    block: "Jawad (JD), streetwear: black bomber jacket, white tee, silver chains, dark jeans, grey-white trainers, watch; high skin fade with a hard part and a full beard. 2.5D cut-outs from his character sheet only; skin texture kept (human-realism Mode B: no face description beyond texture)."
    wardrobe_by_scene: {S3: "streetwear (full body)", S5: "streetwear (bust)"}
    gesture: "stands motionless facing screen-left while the crowd stares at his back (S3); lifts his chin into the warm light up-left (S5)"
  - tag: CROWD-CARD
    identity_source: incidental
    identity_ref: "procedural: log_kya_kahenge_crowd.py"
    block: "Seated head-and-shoulder silhouettes printed in flat warm grey on cut cardboard, 4 figures per strip, 8-12 strip variants; two states with a tonal flip: turned = a dark hair mass (head x0.75 of the print grey, crown down to x0.60, no eyes), front = a light face plate (+40 % oval, never above ASH) with two dim amber catch-light eyes (AMBER <= 1.5x linear, radius >= 1.5 px on rows 0-5 in the wide); a bright cut edge along every outline (0.4 opacity while the card faces the camera, full as it turns edge-on); backs of corrugated brown board with packing tape and a wooden easel strut per figure. No headwear, scarves, flags or markers."
    wardrobe_by_scene: {S1: "front-printed, heads turned (dark) then front (light face plates)", S2: "front, leaning in 1.00 to 1.03", S3: "front, tilting", S4: "turning edge-on, backs visible, then burned away", S6: "gone; flaps rise back, heads turned"}
    gesture: "a head-snap wave from the centre out that reads as heads going dark to light; a lean-in under the judgement lines; a synchronised 9-degree head tilt; a lean-in during the silence"
  - tag: REAL-PEOPLE
    identity_source: incidental
    identity_ref: "procedural: log_kya_kahenge_crowd.py"
    block: "Dark warm silhouettes seated 350 mm behind each card row, heads bowed over phones (amber 1.8x emissive rectangles), faces under-lit amber, no features; about 70 % of seats occupied."
    wardrobe_by_scene: {S4: "phones on", S5: "out-of-focus phone dots behind JD", S6: "phone dots in the warm wide"}
    gesture: "thumbs scrolling; never look up (one person glances up for 6 frames and back down)"
  - tag: SCROLLER
    identity_source: incidental
    identity_ref: "one REAL-PEOPLE figure, row 2, theta about +19 degrees"
    block: "One of the real people, the focus-pull target; phone glow flickers about 15 % at 2.5 Hz as he scrolls."
    wardrobe_by_scene: {S4: "phone on"}
    gesture: "three taps at 21.6, 21.8 and 22.0 s"
locations:
  - tag: AMPHI
    block: "A floodlit amphitheatre of ten curved tiers of seats around an empty dark field (never a cricket ground): bowl centre F at the origin; row i at radius 7000 + 800 i mm, seat height 500 + 560 i mm; arc -75 to +60 degrees; a low barrier wall at radius 6600 mm; a bank of six rectangular lamps on the roof edge top-right."
    anchors:
      - "the floodlight bank top-right of the hook frame (screen about x 973, y 172)"
      - "the low barrier wall between field and tiers (top edge about y 1380-1420 in the hook frame)"
      - "the last card: row 9, theta about +11 degrees (screen about x 820, y 690-790 in the hook frame)"
    light_plot: "Until 25.6 s: hard top key from the lamp bank (cool-neutral ash on cards, amber lamp cores 2.6x, god rays down-left), short shadows straight down, no fill, eyes catch amber. After 25.6 s: lamp bank dark; one low warm FLAME key from screen-left (field edge), raking the tiers, warm haze at the left frame edge; phones amber. 33.6-35.0 s: the warm key hands back to the top floodlight (no clunk) so the last frame matches frame 0."
props:
  - tag: FLOOD-BANK
    block: "six rectangular floodlight lamps, black housings, AMBER x2.6 cores with FLAME glow; noir_ember key glow placed on it with K.background(center=(0.86, 0.10))"
    state_by_shot: {S1-01: "on", S2-01: "on", S3-01: "on (top edge of frame)", S5-01: "off", S6-01: "off", S6-02: "ramps on 33.6-35.0 s"}
  - tag: JUDGE-TYPE
    block: "four judgement lines as 3D type planes, style c15_judge (jw_body 84 px, EMBER halo, NIGHT_0 scrim 0.8): 'Yeh bhi koi / kaam hai?', 'Paise milte hain?', 'Log hasenge.', 'Naukri kab karoge?'"
    state_by_shot: {S2-01: "fly out faster each time (starts f96, f144, f180, f216; 10 / 8 / 6 / 6 frames to the hold depth, out_expo), each recedes when the next starts and is gone 24 frames later (never more than 2 visible); J4 (style c15_judge4, glow 0.5, same 84 px) holds as the last and loudest line until the O2 smoke at 9.6 s"}
  - tag: PHONES
    block: "70 x 140 mm emissive rectangles, AMBER x1.8, under-lighting bowed faces"
    state_by_shot: {S4-01: "revealed as the cards turn", S4-02: "on; the scroller flickers", S4-04: "on", S5-01: "bokeh dots", S6-01: "dots", S6-02: "hidden again as the cards rise"}
  - tag: LAST-CARD
    block: "one CROWD-CARD strip in row 9 that survives the burn"
    state_by_shot: {S6-01: "tips backward 29.2-29.6 s (rx 0 to -100 degrees, in_cubic, SETTLE bounce), tap at 29.6", S6-02: "rises with the others"}
