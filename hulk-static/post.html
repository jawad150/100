<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hulk Marketing: Find the brand</title>
<style>
  @font-face { font-family: Display; src: url(fonts/display.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: UI; src: url(fonts/ui.woff2) format('woff2'); font-weight: 100 900; }
  :root {
    --forest: #111A16; --ink: #20392E; --cream: #F4F2E9; --green: #9DEF69;
    --bg: var(--forest); --fg: var(--cream); --muted: #9AA398; --dot: #2C3B33; --rule: #26332C;
  }
  body.light { --bg: var(--cream); --fg: var(--ink); --muted: #5D685E; --dot: #CDD1C4; --rule: #DAD9CD; }
  html, body { margin: 0; background: #000; }
  .post { position: relative; width: var(--w); height: var(--h); background: var(--bg); color: var(--fg); overflow: hidden; font-family: UI, sans-serif; }
  .top { position: absolute; left: 72px; right: 72px; top: 64px; display: flex; justify-content: space-between; align-items: center; }
  .top img { width: 250px; display: block; }
  .tag { font: 600 22px/1 UI; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .head { position: absolute; left: 72px; right: 72px; font-family: Display; color: var(--fg); }
  .head h1 { margin: 0; font-weight: 900; letter-spacing: -0.045em; line-height: 0.92; }
  .head h1 em { font-style: italic; font-weight: 300; letter-spacing: -0.035em; }
  .grid { position: absolute; }
  .grid i { position: absolute; border-radius: 50%; background: var(--dot); }
  .grid i.hero { background: var(--green); }
  body.light .grid i.hero { box-shadow: 0 0 0 5px var(--ink) inset; }
  .callout { position: absolute; display: flex; align-items: center; gap: 14px; font: 600 22px/1 UI; letter-spacing: 0.16em; text-transform: uppercase; color: var(--green); }
  body.light .callout { color: var(--ink); }
  .callout b { display: block; height: 3px; background: currentColor; }
  .foot { position: absolute; left: 72px; right: 72px; }
  .foot h2 { margin: 0 0 14px; font: 800 54px/1.02 Display; letter-spacing: -0.03em; }
  .foot p { margin: 0; font: 400 28px/1.4 UI; color: var(--muted); max-width: 820px; }
  .bar { position: absolute; left: 72px; right: 72px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid var(--rule); padding-top: 28px; }
  .pill { display: inline-flex; align-items: center; gap: 22px; background: var(--green); color: var(--forest); font: 600 28px/1 UI; padding: 24px 34px; border-radius: 999px; }
  .pill svg { width: 22px; height: 22px; }
  .url { font: 500 26px/1 UI; color: var(--fg); letter-spacing: 0.01em; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="top"><img src="logo.svg" alt="Hulk Marketing"><span class="tag" id="tag">Anything but ordinary</span></div>
  <div class="head" id="head"><h1>Find the brand<br>people <em>remember.</em></h1></div>
  <div class="grid" id="grid"></div>
  <div class="callout" id="callout"><b id="calloutLine"></b><span>That one</span></div>
  <div class="foot" id="foot"><h2>Found it? Of course you did.</h2><p>That’s what standing out looks like. We turn ambitious businesses into brands people notice, choose and come back to.</p></div>
  <div class="bar" id="bar">
    <span class="pill">Let’s make your next move <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M8 5h11v11"/></svg></span>
    <span class="url">hulkmarketing.co.uk</span>
  </div>
</div>
<script>
  // ?fmt=4x5|1x1|9x16  ?theme=dark|light
  const q = new URLSearchParams(location.search);
  const fmt = q.get('fmt') || '4x5';
  if (q.get('theme') === 'light') document.body.classList.add('light');
  const S = { '4x5': [1080, 1350], '1x1': [1080, 1080], '9x16': [1080, 1920] }[fmt];
  const post = document.getElementById('post');
  post.style.setProperty('--w', S[0] + 'px'); post.style.setProperty('--h', S[1] + 'px');
  // per-format layout: [headSize, headTop, gridTop, cols, rows, pitch, r, footTop, barTop, showBody]
  const L = {
    '4x5':  { hs: 112, ht: 168, gt: 452, cols: 9, rows: 5, pitch: 104, r: 30, ft: 958, bt: 1186, body: true },
    '1x1':  { hs: 100, ht: 158, gt: 410, cols: 9, rows: 4, pitch: 100, r: 28, ft: 828, bt: 936, body: false },
    '9x16': { hs: 124, ht: 330, gt: 660, cols: 7, rows: 5, pitch: 118, r: 34, ft: 1640, bt: 1830, body: false },
  }[fmt];
  // Reels/Stories UI covers the top ~250 and bottom ~340 px of a 9:16 frame
  if (fmt === '9x16') { document.querySelector('.top').style.top = '230px'; L.ft = 1270; L.bt = 1440; }
  document.querySelector('#head h1').style.fontSize = L.hs + 'px';
  document.getElementById('head').style.top = L.ht + 'px';
  const grid = document.getElementById('grid');
  const gw = (L.cols - 1) * L.pitch + 2 * L.r;
  grid.style.left = (S[0] - gw) / 2 + 'px'; grid.style.top = L.gt + 'px';
  const hero = fmt === '9x16' ? [4, 2] : [6, 1];
  for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++) {
    const i = document.createElement('i');
    i.style.left = c * L.pitch + 'px'; i.style.top = r * L.pitch + 'px';
    i.style.width = i.style.height = 2 * L.r + 'px';
    if (c === hero[0] && r === hero[1]) i.className = 'hero';
    grid.appendChild(i);
  }
  // callout: a thin rule from the green dot out to the right margin
  const hx = (S[0] - gw) / 2 + hero[0] * L.pitch + 2 * L.r + 14, hy = L.gt + hero[1] * L.pitch + L.r;
  const co = document.getElementById('callout');
  co.style.left = hx + 'px'; co.style.top = (hy - 11) + 'px';
  co.style.whiteSpace = 'nowrap';

  // the grid dot under the callout line is hidden so the rule reads cleanly
  [...grid.children].forEach((el, k) => {
    const c = k % L.cols, r = Math.floor(k / L.cols);
    if (r === hero[1] && c > hero[0]) el.style.visibility = 'hidden';
  });
  document.getElementById('foot').style.top = L.ft + 'px';
  if (!L.body) document.querySelector('#foot p').style.display = 'none';
  document.getElementById('bar').style.top = L.bt + 'px';
  document.fonts.ready.then(() => {
    const txtW = co.querySelector('span').getBoundingClientRect().width;
    document.getElementById('calloutLine').style.width = Math.max(40, S[0] - 72 - hx - txtW - 14) + 'px';
    window.ready = true;
  });
</script>
</body>
</html>
