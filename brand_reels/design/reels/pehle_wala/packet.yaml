  camera_law: "The camera never moves. The frame under review does all the moving: one slow push-in of the product plate, 2 % per bar, that rewinds with Ctrl+Z."
  texture_line: "inferno finish: deep red-black toe crush, film grain 0.020 at 1.7 px from the look only, halation on emissive edges, highlights roll off to orange"
  sound_motif: "the pin thock: a glass tap over a soft impact, and a slot tick on every version step"
  symbol: "the review pin"
  forbidden:
